<!DOCTYPE html>
<html lang="zh-TW" data-theme="blackgold">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霸總的專屬偏愛：林映雪 × 顧亭深｜溫潤互動小說 7000單學習平台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 文青襯線小說體 (Noto Serif TC + Lora) & 介面輔助體 (Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       1. LITERARY INDIE NOVEL DESIGN TOKENS (文青紙感小說風)
       ========================================================================= */
    :root {
      --font-novel: 'Lora', 'Noto Serif TC', 'Songti TC', Georgia, serif;
      --font-ui: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-canvas: #f5f1e8;
      --bg-surface: #fffdf8;
      --bg-soft: #faf6ee;
      --bg-cream: #fdf3e4;
      --border-warm: #e7decb;
      --ink-main: #2b241d;
      --ink-body: #332b23;
      --ink-sub: #7a6d60;
      --caramel: #a85d24;
      --caramel-dark: #874718;
      --caramel-light: #d48c4e;
      --story-size: 19px;
      --bubble-size: 19px;
      --quiz-size: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      color: var(--ink-main);
      font-family: var(--font-ui);
      background-color: var(--bg-canvas);
      background-image: radial-gradient(rgba(168, 93, 36, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Literary Serif Headings */
    h1, h2, h3, .font-novel {
      font-family: var(--font-novel);
    }

    /* Clean Warm Paper Cards */
    .weave-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-warm);
      box-shadow: 0 2px 14px rgba(74, 52, 32, 0.045);
    }

    /* Seamless Book-Page Novel Sheet */
    .novel-sheet {
      background: #fffdf9;
      border: 1px solid #e6dcc8;
      box-shadow: 0 6px 26px rgba(68, 48, 28, 0.055);
      border-radius: 20px;
      padding: 2rem 2.4rem 2.4rem;
    }

    .weave-btn-primary {
      background: linear-gradient(135deg, #b86a2d 0%, #964f1c 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(168, 93, 36, 0.22);
      transition: transform 0.16s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }
    .weave-btn-primary:hover:not(:disabled) {
      opacity: 0.94;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(168, 93, 36, 0.3);
    }

    .weave-hero-banner {
      background:
        radial-gradient(circle at 20% 35%, rgba(255, 224, 178, 0.65) 0%, transparent 52%),
        radial-gradient(circle at 80% 30%, rgba(236, 178, 126, 0.58) 0%, transparent 55%),
        linear-gradient(135deg, #543a2c 0%, #83563a 48%, #ba8354 100%);
    }

    /* Scalable Literary Novel Typography */
    .story-narration {
      font-family: var(--font-novel);
      font-size: var(--story-size);
      line-height: 2.12;
      letter-spacing: 0.035em;
      color: var(--ink-body);
      text-align: justify;
      text-justify: inter-ideograph;
    }

    .dialogue-text {
      font-family: var(--font-novel);
      font-size: var(--bubble-size);
      line-height: 2.04;
      letter-spacing: 0.03em;
      color: var(--ink-main);
    }

    .quiz-text {
      font-family: var(--font-novel);
      font-size: var(--quiz-size);
      line-height: 1.9;
    }

    /* Sidebar & Mobile Navigation Tabs */
    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: #63574d;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .nav-tab:hover {
      background: #f8f3ec;
      color: #964f1c;
    }
    .nav-tab.is-active {
      background: #fdf3e4;
      border-color: #e9cfa9;
      color: #a85d24;
      font-weight: 700;
    }

    /* =========================================================================
       2. SEAMLESS NOVEL DIALOGUE LINES & DELICATE INLINE VOCAB HIGHLIGHTS
       ========================================================================= */
    .novel-dialogue-block {
      position: relative;
      padding: 0.45rem 0 0.45rem 1.05rem;
      border-left: 3px solid #dfd3c0;
      transition: border-color 0.2s ease;
    }
    .novel-dialogue-xue {
      border-left-color: #d68c74;
    }
    .novel-dialogue-shen {
      border-left-color: #8f5428;
      background: linear-gradient(90deg, rgba(253, 244, 232, 0.58) 0%, rgba(255, 253, 249, 0) 92%);
      border-radius: 0 12px 12px 0;
      padding-top: 0.6rem;
      padding-bottom: 0.6rem;
      padding-right: 0.75rem;
    }
    .novel-dialogue-side {
      border-left-color: #bfb5a8;
    }

    /* Refined Literary English Vocab Highlight (Smooth Reading Flow) */
    .kw-pill {
      display: inline;
      font-family: 'Lora', Georgia, serif;
      font-weight: 700;
      color: #934b15;
      background: rgba(246, 224, 194, 0.45);
      border-bottom: 1.5px solid #cf9458;
      padding: 0.04rem 0.34rem 0.06rem;
      margin: 0 0.1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .kw-pill:hover,
    .kw-pill:active {
      background: #a85d24;
      border-bottom-color: #a85d24;
      color: #ffffff;
    }

    .kw-zh {
      font-family: var(--font-novel);
      color: #9e5826;
      font-size: 0.88em;
      font-weight: 500;
      margin: 0 0.08rem;
    }

    .kw-mag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68em;
      color: #9a5a28;
      background: #faf2e6;
      border: 1px solid #e4cfb4;
      border-radius: 9999px;
      width: 1.45em;
      height: 1.45em;
      margin: 0 0.18rem 0 0.05rem;
      cursor: pointer;
      vertical-align: 0.12em;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .kw-mag:hover {
      background: #a85d24;
      color: #ffffff;
      transform: scale(1.1);
    }

    /* Tab 3: Click-to-Flip Quiz Capsule (Literary Underline Style) */
    .kw-quiz-pill {
      display: inline;
      font-family: 'Lora', 'Noto Serif TC', serif;
      background: #fff9ef;
      border: 1.5px dashed #c47d3d;
      color: #8f4914;
      font-weight: 700;
      padding: 0.05rem 0.44rem;
      margin: 0 0.12rem;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      line-height: 1.55;
      transition: all 0.2s ease;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .kw-quiz-pill:hover {
      background: #fbeed9;
    }
    .kw-quiz-pill.is-revealed {
      background: #a85d24;
      border: 1.5px solid #8f4c1a;
      color: #ffffff;
    }

    @keyframes speakGlow {
      0% { box-shadow: 0 0 0 0 rgba(168, 93, 36, 0.45); }
      100% { box-shadow: 0 0 0 9px rgba(168, 93, 36, 0); }
    }
    .speaking-pulse {
      animation: speakGlow 0.55s ease-out;
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .story-enter {
      animation: cardPop 0.28s ease both;
    }

    /* Tab 4: Listening Line Card */
    .listen-card {
      background: #fffdf9;
      border: 1px solid #e7decb;
      border-left: 4px solid #dfc4a4;
      transition: all 0.2s ease;
      cursor: pointer;
